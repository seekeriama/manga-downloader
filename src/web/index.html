<!doctype html>
<html lang="vi" class="pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBZ Downloader</title>
<style>
  :root {
    --bg: #f5f4f0; --panel: #ffffff; --line: #e2dfd7; --text: #1f1d1a; --muted: #6f6a60;
    --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fdeee4;
    --ok: #15803d; --err: #b91c1c; --warn: #b45309; --row-hover: #f7f5f0; --input: #fbfaf7;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --panel: #1f1e1b; --line: #34322d; --text: #ece9e2; --muted: #9c978c;
      --accent: #f97316; --accent-ink: #1a0f06; --accent-soft: #3a2415;
      --ok: #4ade80; --err: #f87171; --warn: #fbbf24; --row-hover: #26241f; --input: #181715;
    }
  }
  html.pending body { visibility: hidden; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .lang button { border: 0; border-radius: 0; padding: 5px 12px; font-size: 13px; font-weight: 600; background: transparent; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  main { max-width: 1240px; margin: 0 auto; padding: 16px 20px 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  input[type=text], input[type=number] {
    font: inherit; color: var(--text); background: var(--input);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0;
  }
  input[type=number] { width: 92px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 12px;
           border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--err); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  #urlForm input { flex: 1; min-width: 220px; }
  #status { margin-top: 8px; min-height: 22px; font-size: 14px; white-space: pre-line; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; margin-top: 16px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  #chapters { display: flex; flex-direction: column; min-height: 420px; }
  .tools { display: grid; gap: 8px; margin-bottom: 10px; }
  #list { flex: 1; overflow: auto; max-height: 62vh; border-top: 1px solid var(--line); margin: 0 -16px -14px; }
  #list label { display: grid; grid-template-columns: 22px 44px 1fr auto; gap: 8px; align-items: center;
                padding: 6px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #list label:hover { background: var(--row-hover); }
  #list .no { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  #list .grp { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 10px; }
  .opts { display: grid; gap: 14px; align-content: start; }
  .field { display: grid; gap: 4px; }
  .field input[type=text] { width: 100%; }
  .choice { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; }
  .choice input { margin-top: 4px; }
  .rule { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .rule label { flex: 1; }
  .kb { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .kb input { width: 86px; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 4px; }
  fieldset:disabled { opacity: .55; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
  .preview { font-size: 13px; color: var(--muted); word-break: break-word; }
  .warn { color: var(--warn); font-size: 13px; }
  #startBtn { width: 100%; padding: 10px; font-size: 15px; }
  #progressCard { margin-top: 16px; display: none; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #progText { margin: 6px 0; font-size: 14px; }
  #result { font-weight: 600; white-space: pre-line; margin: 8px 0; }
  #log { font: 12.5px/1.5 Consolas, "Cascadia Mono", ui-monospace, monospace; max-height: 220px; overflow: auto;
         background: var(--input); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; white-space: pre-wrap; }
  #log .e { color: var(--err); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  #closed { display: none; text-align: center; padding: 80px 20px; }
</style>
</head>
<body>
<header>
  <h1><span>CBZ</span> Downloader</h1>
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="vi" title="Tiếng Việt">VI</button>
    <button type="button" data-lang="en" title="English">EN</button>
  </div>
  <button id="quitBtn" class="danger" data-i18n="quit" data-i18n-title="quitTip"></button>
</header>

<main id="app">
  <section class="card">
    <form id="urlForm" class="row" autocomplete="off">
      <label for="url" data-i18n="urlLabel"></label>
      <input id="url" type="text" data-i18n-ph="urlPh">
      <button id="checkBtn" class="primary" type="submit" data-i18n="check"></button>
    </form>
    <div id="status" class="muted" data-i18n="supported"></div>
  </section>

  <div class="layout">
    <section id="chapters" class="card">
      <h2 id="chapTitle" data-i18n="chapters"></h2>
      <div id="chapTools" class="tools" hidden>
        <div class="row">
          <input id="filter" type="text" class="grow" style="min-width:220px" data-i18n-ph="filterPh">
          <button data-sel="all" type="button" data-i18n="selAll"></button>
          <button data-sel="none" type="button" data-i18n="selNone"></button>
          <button data-sel="invert" type="button" data-i18n="selInvert"></button>
        </div>
        <div class="row">
          <span class="muted" data-i18n="rangeFrom"></span>
          <input id="rFrom" type="number" min="1" value="1">
          <span class="muted" data-i18n="rangeTo"></span>
          <input id="rTo" type="number" min="1" value="1">
          <button id="rangeBtn" type="button" data-i18n="rangeBtn"></button>
        </div>
      </div>
      <div id="list"><div class="empty" data-i18n="emptyList"></div></div>
    </section>

    <aside class="card opts" id="opts">
      <h2 data-i18n="saveOpts"></h2>
      <div class="field">
        <label for="name" data-i18n="nameLabel"></label>
        <input id="name" type="text">
      </div>
      <div class="field">
        <label for="outDir" data-i18n="dirLabel"></label>
        <div class="row"><input id="outDir" type="text" class="grow"><button id="pickBtn" type="button" data-i18n="browse"></button></div>
      </div>
      <fieldset>
        <div class="choice"><input type="radio" name="mode" id="modeEach" value="each" checked><label for="modeEach" data-i18n="modeEach"></label></div>
        <div class="choice"><input type="radio" name="mode" id="modeMerge" value="merge"><label for="modeMerge" data-i18n="modeMerge"></label></div>
        <div id="preview" class="preview"></div>
        <div class="choice"><input type="checkbox" id="overwrite"><label for="overwrite" data-i18n="overwrite"></label></div>
      </fieldset>

      <hr class="sep">
      <h2 data-i18n="adTitle"></h2>
      <div class="muted" data-i18n="adHint"></div>
      <div class="rule">
        <input type="checkbox" id="adBelowOn"><label for="adBelowOn" data-i18n="adBelow"></label>
        <span class="kb"><input id="adBelowKb" type="number" min="1" max="100000" step="1" value="100">KB</span>
      </div>
      <div class="rule">
        <input type="checkbox" id="adAboveOn"><label for="adAboveOn" data-i18n="adAbove"></label>
        <span class="kb"><input id="adAboveKb" type="number" min="1" max="100000" step="10" value="2000">KB</span>
      </div>
      <div id="adWarn" class="warn" hidden data-i18n="adWarn"></div>
      <fieldset id="adBox" disabled>
        <div class="choice"><input type="radio" name="adScope" id="adEdges" checked><label for="adEdges" data-i18n="adEdges"></label></div>
        <div class="choice"><input type="radio" name="adScope" id="adAll"><label for="adAll" data-i18n="adAll"></label></div>
        <div class="choice"><input type="checkbox" id="adSave"><label for="adSave" data-i18n="adSave" data-i18n-html></label></div>
        <div class="muted" data-i18n="adKeep"></div>
      </fieldset>

      <hr class="sep">
      <div class="row"><label for="workers" data-i18n="workers" data-i18n-title="workersTip"></label><input id="workers" type="number" min="1" max="8" value="4"></div>
      <button id="startBtn" class="primary" type="button" disabled></button>
    </aside>
  </div>

  <section id="progressCard" class="card">
    <div class="bar"><div id="bar"></div></div>
    <div id="progText" class="muted"></div>
    <div id="result"></div>
    <pre id="log"></pre>
  </section>
</main>

<div id="closed"><h2 data-i18n="closed"></h2><p class="muted" data-i18n="closeTab"></p></div>

<script>
const I18N = {
  vi: {
    quit: "Tắt phần mềm", quitTip: "Tắt máy chủ nội bộ của phần mềm",
    urlLabel: "Địa chỉ trang truyện", urlPh: "vd. https://truyenggvn.com/truyen-tranh/hanh-trinh-cua-uduchi-5804",
    check: "Kiểm tra",
    supported: "Hỗ trợ: các trang dạng truyenggvn.com và các trang Blogger (vd. pokemonspecial.com).",
    checking: "Đang kiểm tra trang và đọc danh sách chương...",
    okStatus: "✔ Tải được: {n} chương từ {site}", errStatus: "✘ Không tải được. {e}",
    noConn: "✘ Không liên lạc được với phần mềm. Phần mềm đã bị tắt?",
    chapters: "Danh sách chương", chaptersN: "Danh sách chương ({sel}/{total} đã chọn)",
    filterPh: "Lọc theo tên chương / nhóm", selAll: "Chọn hết", selNone: "Bỏ chọn hết", selInvert: "Đảo",
    rangeFrom: "Chọn theo số thứ tự: từ", rangeTo: "đến", rangeBtn: "Chỉ chọn khoảng này",
    emptyList: "Nhập địa chỉ trang truyện rồi bấm “Kiểm tra” để xem danh sách chương.",
    noMatch: "Không có chương nào khớp bộ lọc.", noChapters: "Không có chương nào.",
    saveOpts: "Tùy chọn lưu", nameLabel: "Tên truyện (tên file)", dirLabel: "Thư mục lưu", browse: "Chọn…",
    modeEach: "Lưu từng chương thành file riêng", modeMerge: "Gộp tất cả chương đã chọn thành 1 file CBZ",
    previewMerge: "→ {name}.cbz", previewEach: "→ thư mục \"{name}\", chương đã có sẽ được bỏ qua",
    overwrite: "Ghi đè nếu file đã có",
    adTitle: "Loại bỏ trang quảng cáo",
    adHint: "Bật một hoặc cả hai luật. Ảnh khớp bất kỳ luật nào đang bật sẽ bị loại.",
    adBelow: "Loại ảnh nhỏ hơn", adAbove: "Loại ảnh lớn hơn",
    adWarn: "⚠ Ngưỡng “lớn hơn” đang nhỏ hơn ngưỡng “nhỏ hơn”: mọi ảnh đều sẽ khớp luật.",
    adEdges: "Chỉ xét ảnh đầu và ảnh cuối mỗi chương", adAll: "Xét mọi ảnh trong chương",
    adSave: "Lưu ảnh bị loại vào thư mục <code>_anh_bi_loai</code> để kiểm tra",
    adKeep: "Nếu mọi ảnh của một chương đều khớp luật, chương đó được giữ nguyên.",
    workers: "Số ảnh tải cùng lúc",
    workersTip: "Số ảnh của một chương được tải song song. Cao hơn thì nhanh hơn nhưng dễ bị trang web chặn.",
    startEach: "⬇ Tải {n} chương", startMerge: "⬇ Tải {n} chương và gộp thành 1 file", stop: "■ Dừng",
    stopping: "Đang dừng sau khi xong ảnh hiện tại...", downloading: "Đang tải: {text}  ·  {pct}%",
    confirmQuit: "Đang tải. Tắt phần mềm sẽ dừng lượt tải này. Tiếp tục?",
    closed: "Đã tắt phần mềm.", closeTab: "Bạn có thể đóng tab này.",
  },
  en: {
    quit: "Quit", quitTip: "Shut down the app's local server",
    urlLabel: "Comic page address", urlPh: "e.g. https://truyenggvn.com/truyen-tranh/hanh-trinh-cua-uduchi-5804",
    check: "Check",
    supported: "Supported: sites like truyenggvn.com and Blogger sites (e.g. pokemonspecial.com).",
    checking: "Checking the page and reading the chapter list...",
    okStatus: "✔ Can download: {n} chapters from {site}", errStatus: "✘ Cannot download. {e}",
    noConn: "✘ Cannot reach the app. Has it been closed?",
    chapters: "Chapters", chaptersN: "Chapters ({sel}/{total} selected)",
    filterPh: "Filter by chapter name / group", selAll: "Select all", selNone: "Select none", selInvert: "Invert",
    rangeFrom: "Select by number: from", rangeTo: "to", rangeBtn: "Select only this range",
    emptyList: "Enter a comic page address and press “Check” to see the chapter list.",
    noMatch: "No chapters match the filter.", noChapters: "No chapters.",
    saveOpts: "Save options", nameLabel: "Comic name (file name)", dirLabel: "Save folder", browse: "Browse…",
    modeEach: "Save each chapter as its own file", modeMerge: "Merge all selected chapters into 1 CBZ file",
    previewMerge: "→ {name}.cbz", previewEach: "→ folder \"{name}\", existing chapters are skipped",
    overwrite: "Overwrite existing files",
    adTitle: "Remove ad pages",
    adHint: "Turn on one or both rules. An image matching any active rule is removed.",
    adBelow: "Remove images smaller than", adAbove: "Remove images larger than",
    adWarn: "⚠ The “larger than” limit is below the “smaller than” limit: every image will match.",
    adEdges: "Only check the first and last image of each chapter", adAll: "Check every image in the chapter",
    adSave: "Save removed images to the <code>_anh_bi_loai</code> folder for review",
    adKeep: "If every image in a chapter matches, the chapter is kept as is.",
    workers: "Images downloaded at once",
    workersTip: "How many images of a chapter download in parallel. Higher is faster but sites may block you.",
    startEach: "⬇ Download {n} chapters", startMerge: "⬇ Download {n} chapters into 1 file", stop: "■ Stop",
    stopping: "Stopping after the current images finish...", downloading: "Downloading: {text}  ·  {pct}%",
    confirmQuit: "A download is running. Quitting will stop it. Continue?",
    closed: "The app has been closed.", closeTab: "You can close this tab.",
  },
};
let LANG = "vi";
function T(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.vi[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    if (el.hasAttribute("data-i18n-html")) el.innerHTML = T(el.dataset.i18n);
    else el.textContent = T(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = T(el.dataset.i18nTitle));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}

const $ = (id) => document.getElementById(id);
let chapters = [], selected = [], visible = [], running = false, logLen = 0, pollTimer = null;

const store = {
  get(k, d) { try { const v = localStorage.getItem("tdl_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tdl_" + k, JSON.stringify(v)); } catch {} },
};
const session = {
  take(k) { try { const v = sessionStorage.getItem(k); sessionStorage.removeItem(k); return v && JSON.parse(v); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

async function api(path, body) {
  const opt = body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  return r.json();
}

function setStatus(text, cls) {
  const s = $("status");
  s.removeAttribute("data-i18n");
  s.className = cls === "busy" ? "muted" : (cls || "muted");
  s.innerHTML = "";
  if (cls === "busy") { const sp = document.createElement("span"); sp.className = "spin"; s.append(sp); }
  s.append(document.createTextNode(text));
}

function safeName(s) {
  s = s.replace(/[\\/:*?"<>|\x00-\x1f]/g, "-").split(/\s+/).filter(Boolean).join(" ").replace(/^[ .]+|[ .]+$/g, "");
  return s || "truyen";
}

function updateAdUi() {
  const below = $("adBelowOn").checked, above = $("adAboveOn").checked;
  $("adBelowKb").disabled = running || !below;
  $("adAboveKb").disabled = running || !above;
  $("adBox").disabled = running || !(below || above);
  $("adWarn").hidden = !(below && above && (+$("adAboveKb").value <= +$("adBelowKb").value));
}

function updatePreview() {
  const name = safeName($("name").value.trim() || "truyen");
  $("preview").textContent = $("modeMerge").checked ? T("previewMerge", { name }) : T("previewEach", { name });
  const n = selected.filter(Boolean).length;
  const btn = $("startBtn");
  if (running) { btn.textContent = T("stop"); btn.disabled = false; btn.classList.remove("primary"); return; }
  btn.classList.add("primary");
  btn.textContent = T($("modeMerge").checked ? "startMerge" : "startEach", { n });
  btn.disabled = n === 0;
}

function renderList() {
  const f = $("filter").value.trim().toLowerCase();
  visible = chapters.map((c, i) => i).filter(i => !f ||
    chapters[i].title.toLowerCase().includes(f) || chapters[i].group.toLowerCase().includes(f));
  const list = $("list");
  list.innerHTML = "";
  if (!chapters.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = T("emptyList");
    list.append(e); updateCount(); return;
  }
  const frag = document.createDocumentFragment();
  for (const i of visible) {
    const c = chapters[i];
    const row = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = selected[i]; cb.disabled = running;
    cb.addEventListener("change", () => { selected[i] = cb.checked; updateCount(); });
    const no = document.createElement("span"); no.className = "no"; no.textContent = i + 1;
    const t = document.createElement("span"); t.textContent = c.title;
    const g = document.createElement("span");
    if (c.group) { g.className = "grp"; g.textContent = c.group; }
    row.append(cb, no, t, g);
    frag.append(row);
  }
  if (!visible.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = T("noMatch");
    frag.append(e);
  }
  list.append(frag);
  updateCount();
}

function updateCount() {
  const n = selected.filter(Boolean).length;
  $("chapTitle").textContent = chapters.length ? T("chaptersN", { sel: n, total: chapters.length }) : T("chapters");
  updatePreview();
}

function showSeries(r, sel) {
  chapters = r.chapters;
  selected = (sel && sel.length === chapters.length) ? sel : chapters.map(() => true);
  $("rFrom").max = $("rTo").max = chapters.length;
  $("chapTools").hidden = false;
  setStatus(T("okStatus", { n: chapters.length, site: r.site }), "ok");
}

$("urlForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("url").value.trim();
  if (!url || running) return;
  $("checkBtn").disabled = true;
  setStatus(T("checking"), "busy");
  try {
    const r = await api("/api/inspect", { url });
    if (r.error) {
      chapters = []; selected = [];
      $("chapTools").hidden = true;
      setStatus(T("errStatus", { e: r.error }), "err");
    } else {
      showSeries(r);
      $("name").value = r.title;
      $("rFrom").value = 1; $("rTo").value = chapters.length;
      $("filter").value = "";
      store.set("url", url);
    }
  } catch (err) {
    setStatus(T("noConn"), "err");
  }
  $("checkBtn").disabled = false;
  renderList();
});

$("filter").addEventListener("input", renderList);
document.querySelectorAll("[data-sel]").forEach(b => b.addEventListener("click", () => {
  for (const i of visible) {
    selected[i] = b.dataset.sel === "all" ? true : b.dataset.sel === "none" ? false : !selected[i];
  }
  renderList();
}));
$("rangeBtn").addEventListener("click", () => {
  let a = +$("rFrom").value || 1, b = +$("rTo").value || chapters.length;
  if (a > b) [a, b] = [b, a];
  selected = chapters.map((_, i) => i + 1 >= a && i + 1 <= b);
  renderList();
});

["adBelowOn", "adAboveOn", "adBelowKb", "adAboveKb"].forEach(id => $(id).addEventListener("input", () => { updateAdUi(); saveOpts(); }));
["name", "modeEach", "modeMerge"].forEach(id => $(id).addEventListener("input", () => { updatePreview(); saveOpts(); }));
["outDir", "overwrite", "adEdges", "adAll", "adSave", "workers"].forEach(id => $(id).addEventListener("change", saveOpts));

function saveOpts() {
  store.set("opts", {
    outDir: $("outDir").value, merge: $("modeMerge").checked, overwrite: $("overwrite").checked,
    adBelowOn: $("adBelowOn").checked, adBelowKb: +$("adBelowKb").value,
    adAboveOn: $("adAboveOn").checked, adAboveKb: +$("adAboveKb").value,
    adEdges: $("adEdges").checked, adSave: $("adSave").checked, workers: +$("workers").value,
  });
}

$("pickBtn").addEventListener("click", async () => {
  $("pickBtn").disabled = true;
  try {
    const r = await api("/api/pick-folder", { current: $("outDir").value });
    if (r.path) { $("outDir").value = r.path; saveOpts(); }
  } catch {}
  $("pickBtn").disabled = false;
});

$("startBtn").addEventListener("click", async () => {
  if (running) { await api("/api/cancel", {}); $("progText").textContent = T("stopping"); return; }
  const indices = selected.map((s, i) => s ? i : -1).filter(i => i >= 0);
  const r = await api("/api/start", {
    indices, name: $("name").value, out_dir: $("outDir").value,
    merge: $("modeMerge").checked, overwrite: $("overwrite").checked,
    ad_below_on: $("adBelowOn").checked, ad_below_kb: +$("adBelowKb").value || 100,
    ad_above_on: $("adAboveOn").checked, ad_above_kb: +$("adAboveKb").value || 2000,
    ad_edges_only: $("adEdges").checked, ad_save: $("adSave").checked,
    workers: +$("workers").value || 4,
  });
  if (r.error) { alert(r.error); return; }
  logLen = 0; $("log").innerHTML = ""; $("result").textContent = "";
  $("progressCard").style.display = "block";
  setRunning(true);
  poll();
});

function setRunning(v) {
  running = v;
  for (const id of ["url", "checkBtn", "name", "outDir", "pickBtn", "filter", "rangeBtn", "adBelowOn", "adAboveOn",
                    "modeEach", "modeMerge", "overwrite", "workers", "rFrom", "rTo"]) $(id).disabled = v;
  document.querySelectorAll("[data-sel]").forEach(el => el.disabled = v);
  updateAdUi();
  renderList();
}

async function poll() {
  clearTimeout(pollTimer);
  let r;
  try { r = await api(`/api/status?since=${logLen}`); }
  catch { pollTimer = setTimeout(poll, 1500); return; }
  const log = $("log");
  for (const line of r.log) {
    const d = document.createElement("div");
    if (line.startsWith("[LỖI]") || line.startsWith("[ERROR]")) d.className = "e";
    d.textContent = line;
    log.append(d);
  }
  if (r.log.length) log.scrollTop = log.scrollHeight;
  logLen = r.log_len;
  const pct = r.total ? Math.round(100 * r.done / r.total) : 0;
  $("bar").style.width = (r.running ? pct : 100) + "%";
  $("progText").textContent = r.running ? (r.cancelling ? T("stopping") : T("downloading", { text: r.text, pct })) : "";
  if (r.result) $("result").textContent = r.result;
  if (r.running) pollTimer = setTimeout(poll, 700);
  else setRunning(false);
}

// Đổi ngôn ngữ: lưu lựa chọn ở phần mềm, giữ lại danh sách chương đang chọn, rồi tải lại trang
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", async () => {
  if (b.dataset.lang === LANG) return;
  session.set("restore", { selected, filter: $("filter").value, name: $("name").value,
                           rFrom: $("rFrom").value, rTo: $("rTo").value, url: $("url").value });
  try { await api("/api/lang", { lang: b.dataset.lang }); } catch {}
  location.reload();
}));

$("quitBtn").addEventListener("click", async () => {
  if (running && !confirm(T("confirmQuit"))) return;
  try { await api("/api/quit", {}); } catch {}
  $("app").style.display = "none"; document.querySelector("header").style.display = "none";
  $("closed").style.display = "block";
});

(async function init() {
  let d = {};
  try { d = await api("/api/defaults"); } catch {}
  LANG = d.lang === "en" ? "en" : "vi";
  applyI18n();

  const o = store.get("opts", null);
  $("outDir").value = (o && o.outDir) || d.out_dir || "";
  if (o) {
    $("modeMerge").checked = !!o.merge; $("modeEach").checked = !o.merge;
    $("overwrite").checked = !!o.overwrite;
    $("adBelowOn").checked = o.adBelowOn ?? !!o.adOn;            // tương thích bản cũ (adOn/adKb)
    $("adBelowKb").value = o.adBelowKb || o.adKb || 100;
    $("adAboveOn").checked = !!o.adAboveOn; $("adAboveKb").value = o.adAboveKb || 2000;
    $("adEdges").checked = o.adEdges !== false; $("adAll").checked = o.adEdges === false;
    $("adSave").checked = !!o.adSave; $("workers").value = o.workers || 4;
  }
  $("url").value = store.get("url", "");

  // sau khi đổi ngôn ngữ: khôi phục danh sách chương (tên chương lấy lại theo ngôn ngữ mới)
  const keep = session.take("restore");
  try {
    const s = await api("/api/series");
    if (s && s.chapters) {
      showSeries(s, keep && keep.selected);
      $("name").value = (keep && keep.name) || s.title;
      $("filter").value = (keep && keep.filter) || "";
      $("rFrom").value = (keep && keep.rFrom) || 1; $("rTo").value = (keep && keep.rTo) || chapters.length;
      if (keep && keep.url) $("url").value = keep.url;
    }
  } catch {}
  updateAdUi();
  renderList();
  document.documentElement.classList.remove("pending");

  // nếu đang có lượt tải chạy (vd. vừa đổi ngôn ngữ hoặc mở lại tab), tiếp tục hiển thị tiến độ
  try {
    const st = await api("/api/status?since=0");
    if (st.running || st.result) { $("progressCard").style.display = "block"; }
    if (st.running) { setRunning(true); poll(); }
    else if (st.result) { logLen = 0; await poll(); }
  } catch {}
})();
</script>
